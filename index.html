<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aditi &amp; Arjun — Wedding Invitation</title>
  <meta name="description" content="You are cordially invited to the wedding of Aditi & Arjun.">
  <meta name="theme-color" content="#b08467">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@600&family=EB+Garamond:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/intro/000.webp" media="(hover: hover), (pointer: fine)">
  <link rel="preload" as="image" href="assets/intro-m/000.webp" media="(hover: none) and (pointer: coarse)">
  <link rel="stylesheet" href="css/style.css?v=48">
</head>
<body class="is-loading">

  <!-- Loader -->
  <div class="loader" id="loader" aria-live="polite">
    <div class="loader__mono"><span data-bind="bride.short.0"></span><i>&amp;</i><span data-bind="groom.short.0"></span></div>
    <div class="loader__bar"><span id="loaderBar"></span></div>
    <p class="loader__text">Preparing your invitation&hellip;</p>
  </div>

  <main class="app">

    <!-- ============ INTRO: scroll-scrubbed curtain reveal ============ -->
    <section class="intro" id="home" aria-label="Opening">
      <div class="intro__stage" id="stage">
        <div class="intro__frame" id="frame">
          <canvas id="introCanvas" width="702" height="1300" aria-hidden="true"></canvas>
          <video id="introLoop" class="intro__loop" muted loop playsinline preload="none"
                 poster="assets/scene-poster.jpg" aria-hidden="true">
            <source src="assets/scene-loop.mp4" type="video/mp4">
          </video>
          <div class="intro__haze" id="introHaze"></div>
          <h1 class="intro__title" id="introTitle">
            <span class="t-sub" data-letters>The Wedding of</span>
            <span class="t-name t-name--1" data-letters data-bind="bride.short"></span>
            <span class="t-amp" data-letters>&amp;</span>
            <span class="t-name t-name--2" data-letters data-bind="groom.short"></span>
          </h1>
        </div>

        <div class="flutter flutter--stage" id="stageFlutter" aria-hidden="true"></div>

        <div class="intro__cover" id="introCover">
          <p class="cover__dear">Dear</p>
          <p class="cover__guest" id="guestName">Honoured Guest</p>
          <p class="cover__line">You are cordially invited to our wedding</p>
          <button class="btn btn--glow" id="openBtn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5 12 13l9-5.5M4.5 5h15A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11A1.5 1.5 0 0 1 4.5 5Z"/></svg>
            Open Invitation
          </button>
          <p class="cover__hint">or scroll to begin</p>
        </div>

        <div class="intro__next" id="introNext" aria-hidden="true">
          <span>Scroll</span>
          <i></i>
        </div>
      </div>
    </section>

    <!-- ============ INVITATION CARD ============ -->
    <!-- ============ AFTER THE OPENING: your new images go here ============ -->
    <div class="card" id="card">
      <section class="after" id="after" aria-label="Invitation">
        <img src="assets/pages/01.webp" alt="Dear guest — together with our families, we request the pleasure of your company to celebrate our wedding" width="906" height="1708" decoding="async">
        <img src="assets/pages/02.webp" alt="Bride and groom" width="906" height="1508" decoding="async">
        <figure class="weds" id="weds">
          <img src="assets/pages/03.webp" alt="" width="906" height="1496" loading="lazy" decoding="async">
          <div class="weds__text">
            <p class="weds__name">Aditi</p>
            <p class="weds__of">Daughter of</p>
            <p class="weds__parents">Mrs. Sunita Rathore<br>&amp; Mr. Vikram Rathore</p>
            <p class="weds__weds"><span></span>Weds<span></span></p>
            <p class="weds__name">Arjun</p>
            <p class="weds__of">Son of</p>
            <p class="weds__parents">Mrs. Meera Singh<br>&amp; Mr. Rajendra Singh</p>
            <p class="weds__rule"><span></span>&#10059;<span></span></p>
            <p class="weds__date">20 – 21 February 2027</p>
            <p class="weds__venue">Udaipur Marriott Hotel</p>
          </div>
        </figure>
        <figure class="haldi" id="haldiFig">
          <img src="assets/pages/04.webp" alt="Haldi — 18 February 2027, 10:00 AM onwards, The Palace Courtyard" width="910" height="1729" loading="lazy" decoding="async">
          <canvas class="haldi__fx" id="haldiFx" aria-hidden="true"></canvas>
        </figure>
        <figure class="sangeet" id="sangeet">
          <img src="assets/pages/05.webp" alt="Sangeet — 19 February 2027, 7:00 PM onwards, The Grand Darbar Hall" width="907" height="1733" loading="lazy" decoding="async">
          <canvas class="fireworks" id="fireworks" aria-hidden="true"></canvas>
        </figure>
        <figure class="wedding" id="weddingFig">
          <img src="assets/pages/06.webp" alt="Wedding — 20 February 2027, Muhurat at 5:00 PM, The Royal Mandap" width="904" height="1740" loading="lazy" decoding="async">
          <canvas class="havan" id="havan" aria-hidden="true"></canvas>
        </figure>
        <figure class="rsvp" id="rsvp">
          <div class="rsvp__stage">
            <div class="rsvp__frame">
              <img src="assets/pages/07.webp" alt="RSVP — We would be honoured by your presence! With love, Aditi &amp; Arjun" width="903" height="1742" loading="lazy" decoding="async">
              <img class="rsvp__car" id="rsvpCar" src="assets/pages/07-car.webp" alt="Aditi and Arjun arriving in a vintage car" width="1100" height="727" loading="lazy" decoding="async">
            </div>
          </div>
        </figure>
      </section>
    </div>

  </main>

  <script src="js/config.js?v=48"></script>
  <script src="js/main.js?v=48"></script>
  <script src="js/intro-manifest.js?v=48"></script>
  <script src="js/intro.js?v=48"></script>
</body>
</html>
